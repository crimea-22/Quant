// ===== movement =====
let yaw=0,pitch=-.03,pos=new THREE.Vector3(0,1.65,26),keys={},joy=0;
const hit=(x,z)=>Math.abs(x)>23.2||z<-28.6||z>27.6||GX.some(g=>Math.abs(x-g)<.95&&z>ZA-.3&&z<ZB+.3)||[-7,7].some(c=>Math.abs(x-c)<1.8&&Math.abs(z-20)<1)||[-17,17].some(c=>Math.abs(x-c)<2&&Math.abs(z-14)<1.4);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=1});addEventListener('keyup',e=>keys[e.code]=0);
function move(dt){const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+joy,r=(keys.KeyD?1:0)-(keys.KeyA?1:0);
 if(keys.ArrowLeft)yaw+=1.8*dt;if(keys.ArrowRight)yaw-=1.8*dt;const v=(keys.ShiftLeft?6.5:3.6)*dt;
 const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*r)*v,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*r)*v;
 if(!hit(pos.x+dx,pos.z))pos.x+=dx;if(!hit(pos.x,pos.z+dz))pos.z+=dz}
let dn=null,mv=0;
cv.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY};mv=0;cv.setPointerCapture(e.pointerId)});

 else{const p=pick(e.clientX,e.clientY),pl=$('#plus');if(p){pl.style.display='grid';pl.style.left=e.clientX+'px';pl.style.top=e.clientY+'px'}else pl.style.display='none'}});
cv.addEventListener('pointerup',e=>{if(dn&&mv<6){const p=pick(e.clientX,e.clientY);if(p)show(p)}dn=null});
document.querySelectorAll('#dp button').forEach(b=>{b.onpointerdown=()=>joy=+b.dataset.d;b.onpointerup=b.onpointerleave=()=>joy=0});
const rc=new THREE.Raycaster();rc.far=9;
function pick(cx,cy){rc.setFromCamera({x:cx/innerWidth*2-1,y:-cy/innerHeight*2+1},cam);const h=rc.intersectObjects(MS,false)[0];return h&&h.object.userData.p}

// ===== popup, cart, search =====
let cur=null,cart={};
function show(p){cur=p;$('#pi').src=p.cv.toDataURL();$('#pn').textContent=p.name;$('#pd').textContent=String(p.dn+3).padStart(2,'0')+' · '+p.dept;$('#pp').textContent=kes(p.price);$('#pa').textContent=T[L].add;$('#pop').style.display='flex'}
$('#px').onclick=()=>{$('#pop').style.display='none'};
$('#pa').onclick=()=>{cart[cur.id]=(cart[cur.id]||0)+1;render();$('#pa').textContent='✓';setTimeout(()=>$('#pa').textContent=T[L].add,700)};
const byId=id=>P.find(p=>p.id==id);
function render(){const ids=Object.keys(cart).filter(k=>cart[k]>0);let n=0,t=0;$('#li').innerHTML='';
 ids.forEach(id=>{const p=byId(id),q=cart[id];n+=q;t+=q*p.price;const d=document.createElement('div');d.className='it';d.innerHTML=`<img src="${p.cv.toDataURL()}"><div><b>${p.name}</b><br>${kes(p.price)}</div><button data-a="-">−</button><b>${q}</b><button data-a="+">+</button>`;
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>{cart[id]+=b.dataset.a=='+'?1:-1;render()});$('#li').appendChild(d)});
 $('#cn').textContent=n;$('#ct').textContent=n?kes(t):T[L].empty;$('#tv').textContent=kes(t)}
$('#cb').onclick=()=>$('#dr').classList.add('o');$('#dx').onclick=()=>$('#dr').classList.remove('o');
$('#pay').onclick=()=>{const ph=$('#ph').value.trim(),n=Object.values(cart).reduce((a,b)=>a+b,0);const m=$('#msg');
 if(!n){m.style.color='#c00';m.textContent='Cart is empty';return}if(!/^(\+?254|0)[17]\d{8}$/.test(ph)){m.style.color='#c00';m.textContent='Enter a valid Safaricom/Airtel number';return}
 m.style.color='#2e7d32';m.textContent='M-Pesa prompt sent to '+ph+' — enter your PIN (demo)';setTimeout(()=>{cart={};render();m.textContent='Asante! Order placed. 🇰🇪';toon('Asante! Karibu tena 🇰🇪')},2600)};
function go0(p){pos.set(p.gx+p.s*2.4,1.65,p.z+.3);yaw=p.s*Math.PI/2;pitch=-.1;show(p)}
$('#q').oninput=e=>{const v=e.target.value.toLowerCase().trim(),r=$('#res');if(!v){r.style.display='none';return}
 const m=P.filter(p=>p.name.toLowerCase().includes(v)||p.dept.toLowerCase().includes(v)).slice(0,12);r.innerHTML='';m.forEach(p=>{const d=document.createElement('div');d.innerHTML=`${p.name}<small>${kes(p.price)}</small>`;d.onclick=()=>{go(p);r.style.display='none';e.target.value=''};r.appendChild(d)});r.style.display=m.length?'block':'none'};
D.forEach((d,i)=>{const e=document.createElement('div');e.textContent=String(i+3).padStart(2,'0')+'  '+d[0];e.onclick=()=>{go(P.find(p=>p.dn==i));$('#pop').style.display='none';$('#mm').style.display='none'};$('#mm').appendChild(e)});

// ===== product photos: put files in images/<slug>.jpg|png|webp (see "Photo file names" in More) =====
function slug(p){return p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function loadPhoto(p){if(location.protocol==='file:')return;let i=0;const ex=['jpg','png','webp'],im=new Image();
 im.onerror=()=>{if(++i<ex.length)im.src='images/'+slug(p)+'.'+ex[i]};
 im.onload=()=>{const x=p.cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,128,192);const r=Math.min(124/im.width,150/im.height);x.drawImage(im,64-im.width*r/2,78-im.height*r/2,im.width*r,im.height*r);
  x.fillStyle='#0a3fb8';x.fillRect(0,158,128,34);x.fillStyle='#fff';x.font='bold 20px Arial';x.textAlign='center';x.fillText(p.price,64,182);p.lab.map.needsUpdate=true;if(cur===p)show(p);render()};
 im.src='images/'+slug(p)+'.jpg'}
const ck=document.createElement('div');ck.textContent='📷 Photo file names (.txt)';
ck.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([P.map(p=>slug(p)+'.jpg   <-   '+p.name+' ('+p.dept+')').join('\n')]));a.download='photo-list.txt';a.click()};$('#mm').appendChild(ck);

// ===== music: plays music/1.mp3,2.mp3,3.mp3 if you add them, otherwise an original synthesized golden-oldies style loop =====
let AC,mg,au,pl=0,mt=0,sy=0;
function music(){if(pl)return;pl=1;AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination);file(0)}
function file(i){au=new Audio('music/'+(i+1)+'.mp3');au.volume=.5;au.muted=!!mt;au.onended=()=>file((i+1)%3);au.onerror=()=>{i?file(0):synth()};au.play().catch(()=>{i||synth()})}
function synth(){if(sy)return;sy=1;const ch=[[48,52,55,60],[45,48,52,57],[41,45,48,53],[43,47,50,55]],mel=[[72,0,76,0,79,0,76,72],[69,0,72,0,76,0,72,69],[69,0,72,0,77,0,72,0],[71,0,74,0,79,0,74,71]],sp=60/84/2,f=m=>440*Math.pow(2,(m-69)/12);let n=0,t=AC.currentTime+.1;
 const note=(m,t,d,ty,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)};
 const hat=t=>{const b=AC.createBuffer(1,2205,44100),d=b.getChannelData(0);for(let i=0;i<2205;i++)d[i]=(Math.random()*2-1)*(1-i/2205);const s=AC.createBufferSource(),g=AC.createGain(),h=AC.createBiquadFilter();h.type='highpass';h.frequency.value=6000;g.gain.value=.05;s.buffer=b;s.connect(h);h.connect(g);g.connect(mg);s.start(t)};
 setInterval(()=>{while(t<AC.currentTime+.3){const bar=Math.floor(n/8)%4,k=n%8,c=ch[bar],tt=t+(k%2?sp*.25:0);
  note(c[[0,1,2,3,2,1,2,1][k]]+12,tt,.9,'triangle',.06);if(mel[bar][k])note(mel[bar][k],tt,.7,'sine',.06);if(k==0||k==4)note(c[0]-12,tt,.8,'sine',.18);if(k==2||k==6)hat(tt);t+=sp;n++}},50)}
$('#mu').onclick=()=>{mt=!mt;$('#mu').textContent=mt?'🔇':'🔊';if(mg)mg.gain.value=mt?0:.5;if(au)au.muted=mt};
